{% extends "base.html" %}
{% block title %}Abrir Día - SABOR{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-calendar-plus"></i> Abrir Día de Ventas</h5>
            </div>
            <div class="card-body text-center">
                <p class="text-muted mb-4">No hay registro de ventas abierto para hoy. Abre el día para empezar a registrar.</p>

                <form method="POST" action="{{ url_for('ventas.abrir_dia') }}">
                    {{ form.hidden_tag() }}
                    <div class="mb-3">
                        <label class="form-label">{{ form.fecha.label.text }}</label>
                        {{ form.fecha(class="form-control", type="date") }}
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="bi bi-play-circle"></i> Abrir Día
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
