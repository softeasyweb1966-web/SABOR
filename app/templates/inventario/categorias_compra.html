{% extends "base.html" %}
{% block title %}Categorías de Compra - SABOR{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3><i class="bi bi-tags"></i> Categorías de Compra</h3>
    <a href="{{ url_for('inventario.crear_categoria_compra') }}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Nueva Categoría
    </a>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cat in categorias %}
                    <tr>
                        <td class="fw-semibold">{{ cat.nombre }}</td>
                        <td>
                            {% if cat.activa %}
                            <span class="badge bg-success">Activa</span>
                            {% else %}
                            <span class="badge bg-secondary">Inactiva</span>
                            {% endif %}
                        </td>
                        <td class="text-center">
                            <a href="{{ url_for('inventario.editar_categoria_compra', id=cat.id) }}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form action="{{ url_for('inventario.eliminar_categoria_compra', id=cat.id) }}" method="POST" class="d-inline" onsubmit="return confirm('¿Eliminar?');">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
