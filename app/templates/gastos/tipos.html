{% extends "base.html" %}
{% block title %}Tipos de Gasto - SABOR{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3><i class="bi bi-tags"></i> Tipos de Gasto</h3>
    <a href="{{ url_for('gastos.crear_tipo') }}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Nuevo Tipo
    </a>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for tipo in tipos %}
                    <tr>
                        <td class="fw-semibold">{{ tipo.nombre }}</td>
                        <td>
                            {% if tipo.activo %}
                            <span class="badge bg-success">Activo</span>
                            {% else %}
                            <span class="badge bg-secondary">Inactivo</span>
                            {% endif %}
                        </td>
                        <td class="text-center">
                            <a href="{{ url_for('gastos.editar_tipo', id=tipo.id) }}" class="btn btn-sm btn-outline-primary" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form action="{{ url_for('gastos.eliminar_tipo', id=tipo.id) }}" method="POST" class="d-inline" onsubmit="return confirm('¿Eliminar este tipo?');">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
